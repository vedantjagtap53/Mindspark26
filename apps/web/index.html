<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinStrukt — Structured Products Suitability Simulator</title>
    <meta
      name="description"
      content="Suitability-aware payoff simulator for ELN, DCD and CPN, used by relationship managers."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      // Apply the saved theme (ms_theme cookie) before first paint, so a dark-mode user never
      // sees a flash of the light theme. The app keeps it in sync once it has loaded.
      (function () {
        try {
          var m = document.cookie.match(/(?:^|; )ms_theme=([^;]*)/);
          var t = m ? decodeURIComponent(m[1]) : 'light';
          var dark =
            t === 'dark' ||
            (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
