# Reads used by the backend. Server-only.

query GetClientProfile($id: UUID!) @auth(level: NO_ACCESS) {
  clientProfile(id: $id) {
    id
    clientRef
    label
    riskAppetite
    horizonMonths
    lossTolerancePct
    concentrationPct
    createdAt
    updatedAt
  }
}

query GetClientProfileByRef($clientRef: String!) @auth(level: NO_ACCESS) {
  clientProfiles(where: { clientRef: { eq: $clientRef } }, limit: 1) {
    id
    clientRef
    label
    riskAppetite
    horizonMonths
    lossTolerancePct
    concentrationPct
    createdAt
    updatedAt
  }
}

query ListClientProfiles($limit: Int!, $offset: Int!) @auth(level: NO_ACCESS) {
  clientProfiles(orderBy: [{ updatedAt: DESC }], limit: $limit, offset: $offset) {
    id
    clientRef
    label
    riskAppetite
    horizonMonths
    lossTolerancePct
    concentrationPct
    createdAt
    updatedAt
  }
}

query GetProductConfiguration($id: UUID!) @auth(level: NO_ACCESS) {
  productConfiguration(id: $id) {
    id
    productType
    underlyingSymbol
    depositCurrency
    alternateCurrency
    tenorDays
    notional
    terms
    createdAt
  }
}

# The full audit record for one simulation.
query GetSimulation($id: UUID!) @auth(level: NO_ACCESS) {
  simulation(id: $id) {
    id
    profile {
      id
    }
    configuration {
      id
      productType
      underlyingSymbol
      depositCurrency
      alternateCurrency
      tenorDays
      notional
      terms
      createdAt
    }
    mode
    profileSnapshot
    levelValue
    levelSource
    levelAsOf
    shockPct
    shockedLevel
    trainingWindowYears
    forecastMeta
    pathCount
    probabilityOfLoss
    probabilityOfKnockIn
    payoffP5
    payoffP50
    payoffP95
    createdAt
    riskResults_on_simulation(orderBy: [{ scenario: ASC }]) {
      scenario
      percentile
      terminal
      pathMin
      payoff
      returnPct
      lossAmount
      knockedIn
      details
      createdAt
    }
    suitabilityResult_on_simulation {
      id
      verdict
      flags
      rulesVersion
      createdAt
    }
    explanations_on_simulation(orderBy: [{ createdAt: ASC }]) {
      id
      text
      model
      sources
      createdAt
    }
  }
}

# Summaries of a client's simulations, newest first.
query ListSimulationsForProfile($profileId: UUID!, $limit: Int!) @auth(level: NO_ACCESS) {
  simulations(
    where: { profileId: { eq: $profileId } }
    orderBy: [{ createdAt: DESC }]
    limit: $limit
  ) {
    id
    mode
    createdAt
    configuration {
      id
      productType
      tenorDays
      notional
    }
    suitabilityResult_on_simulation {
      verdict
    }
  }
}
