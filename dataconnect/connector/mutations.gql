# Writes used by the backend. Server-only; no delete operations exist by design.

mutation CreateClientProfile(
  $clientRef: String!
  $label: String
  $riskAppetite: RiskAppetite!
  $horizonMonths: Int!
  $lossTolerancePct: Float!
  $concentrationPct: Float!
) @auth(level: NO_ACCESS) {
  clientProfile_insert(
    data: {
      clientRef: $clientRef
      label: $label
      riskAppetite: $riskAppetite
      horizonMonths: $horizonMonths
      lossTolerancePct: $lossTolerancePct
      concentrationPct: $concentrationPct
    }
  )
}

# Full replacement of the editable fields (PUT semantics). Returns null if the id does not exist.
mutation UpdateClientProfile(
  $id: UUID!
  $clientRef: String!
  $label: String
  $riskAppetite: RiskAppetite!
  $horizonMonths: Int!
  $lossTolerancePct: Float!
  $concentrationPct: Float!
) @auth(level: NO_ACCESS) {
  clientProfile_update(
    id: $id
    data: {
      clientRef: $clientRef
      label: $label
      riskAppetite: $riskAppetite
      horizonMonths: $horizonMonths
      lossTolerancePct: $lossTolerancePct
      concentrationPct: $concentrationPct
      updatedAt_expr: "request.time"
    }
  )
}

mutation CreateProductConfiguration(
  $productType: ProductType!
  $underlyingSymbol: String
  $depositCurrency: String
  $alternateCurrency: String
  $tenorDays: Int!
  $notional: Float!
  $terms: Any!
) @auth(level: NO_ACCESS) {
  productConfiguration_insert(
    data: {
      productType: $productType
      underlyingSymbol: $underlyingSymbol
      depositCurrency: $depositCurrency
      alternateCurrency: $alternateCurrency
      tenorDays: $tenorDays
      notional: $notional
      terms: $terms
    }
  )
}

# A simulation and all of its risk results in one atomic insert, so an audit record is never partial.
mutation RecordSimulation(
  $configurationId: UUID!
  $profileId: UUID
  $mode: SimulationMode!
  $profileSnapshot: Any
  $levelValue: Float
  $levelSource: LevelSource
  $levelAsOf: String
  $shockPct: Float
  $shockedLevel: Float
  $trainingWindowYears: Int
  $forecastMeta: Any
  $pathCount: Int
  $probabilityOfLoss: Float
  $probabilityOfKnockIn: Float
  $payoffP5: Float
  $payoffP50: Float
  $payoffP95: Float
  # At most 4 rows (LOW/BASE/HIGH or SHOCK); the repository enforces the count. `maxCount` is not
  # used because SQL Connect counts each element more than once (3 rows were reported as 6).
  $riskResults: [RiskResult_Data!]!
    @allow(
      fields: "scenario percentile terminal pathMin payoff returnPct lossAmount knockedIn details"
    )
) @auth(level: NO_ACCESS) @transaction {
  simulation_insert(
    data: {
      configurationId: $configurationId
      profileId: $profileId
      mode: $mode
      profileSnapshot: $profileSnapshot
      levelValue: $levelValue
      levelSource: $levelSource
      levelAsOf: $levelAsOf
      shockPct: $shockPct
      shockedLevel: $shockedLevel
      trainingWindowYears: $trainingWindowYears
      forecastMeta: $forecastMeta
      pathCount: $pathCount
      probabilityOfLoss: $probabilityOfLoss
      probabilityOfKnockIn: $probabilityOfKnockIn
      payoffP5: $payoffP5
      payoffP50: $payoffP50
      payoffP95: $payoffP95
      riskResults_on_simulation: $riskResults
    }
  )
}

mutation CreateSuitabilityResult(
  $simulationId: UUID!
  $verdict: SuitabilityVerdict!
  $flags: Any!
  $rulesVersion: String!
) @auth(level: NO_ACCESS) {
  suitabilityResult_insert(
    data: {
      simulationId: $simulationId
      verdict: $verdict
      flags: $flags
      rulesVersion: $rulesVersion
    }
  )
}

mutation CreateExplanation($simulationId: UUID!, $text: String!, $model: String!, $sources: Any)
@auth(level: NO_ACCESS) {
  explanation_insert(
    data: { simulationId: $simulationId, text: $text, model: $model, sources: $sources }
  )
}
