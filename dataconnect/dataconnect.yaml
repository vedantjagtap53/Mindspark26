# Firebase SQL Connect service definition.
# serviceId and location must match FIREBASE_SQL_CONNECT_SERVICE_ID and
# FIREBASE_SQL_CONNECT_LOCATION in .env. The values below are placeholders:
# the Firebase project, region and Cloud SQL instance have not been chosen yet.
specVersion: 'v1'
serviceId: 'finstrukt-service'
location: 'asia-southeast1'
schema:
  source: './schema'
  datasource:
    postgresql:
      database: 'finstrukt-database'
      cloudSql:
        instanceId: 'finstrukt-instance'
connectorDirs: ['./connector']
